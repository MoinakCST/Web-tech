<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade & SGPA Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Student Grade & SGPA Calculator</h1>

        <label for="name">Student Name:</label>
        <input type="text" id="name" placeholder="Enter your name">

        <h2>Enter Marks</h2>

        <label>Subject 1:</label>
        <input type="number" id="sub1" min="0" max="100">

        <label>Subject 2:</label>
        <input type="number" id="sub2" min="0" max="100">

        <label>Subject 3:</label>
        <input type="number" id="sub3" min="0" max="100">

        <label>Subject 4:</label>
        <input type="number" id="sub4" min="0" max="100">

        <label>Subject 5:</label>
        <input type="number" id="sub5" min="0" max="100">

        <button onclick="calculateResult()">Calculate Result</button>

        <div id="error"></div>

        <div id="result">
            <h2>Result</h2>

            <p id="studentName"></p>
            <p id="total"></p>
            <p id="percentage"></p>
            <p id="grades"></p>
            <p id="sgpa"></p>
            <p id="finalResult"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
