<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Setup</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="setup-body">

    <div class="setup-window">

        <!-- Close button -->
        <div class="close-button">×</div>

        <h2>Page Setup</h2>

        <div class="setup-content">

            <!-- LEFT SIDE -->
            <div class="left-section">

                <h3>Orientation</h3>

                <div class="orientation">
                    <label>
                        <input type="radio" name="orientation" checked>
                        Portrait
                    </label>

                    <label>
                        <input type="radio" name="orientation">
                        Landscape
                    </label>
                </div>


                <h3>Paper Size</h3>

                <select class="paper-size">
                    <option>Letter (21.6 cm x 27.9 cm)</option>
                    <option>A4 (21 cm x 29.7 cm)</option>
                    <option>A3 (29.7 cm x 42 cm)</option>
                </select>


                <h3>Page Colour</h3>
                <label>
                    <input type="color" id="clr">
                </label>

            </div>


            <!-- RIGHT SIDE -->
            <div class="right-section">

                <h3>
                    Margins
                    <span>(centimetres)</span>
                </h3>

                <div class="margin-row">
                    <label>Top</label>
                    <input type="text" value="2.54">
                </div>

                <div class="margin-row">
                    <label>Bottom</label>
                    <input type="text" value="2.54">
                </div>

                <div class="margin-row">
                    <label>Left</label>
                    <input type="text" value="2.54">
                </div>

                <div class="margin-row">
                    <label>Right</label>
                    <input type="text" value="2.54">
                </div>

            </div>

        </div>


        <!-- BUTTONS -->
        <div class="setup-buttons">

            <button class="ok-button">
                OK
            </button>

            <button class="cancel-button">
                Cancel
            </button>

            <button class="default-button">
                Set as default
            </button>

        </div>

    </div>

</body>
</html>
