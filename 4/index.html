<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PHP Client-Server Communication</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>PHP Client-Server Communication</h1>

        <section class="card">

            <h2>1.Hello PHP</h2>

            <!-- <button onclick="helloPHP()">
                Display Hello PHP
            </button>  -->

            <div id="helloResult" class="result"></div>

        </section>


        <section class="card">

            <h2>2. Student Grade</h2>

            <label for="marks">Enter Marks:</label>

            <input
                type="number"
                id="marks"
                min="0"
                max="100"
                placeholder="Enter marks"
            >

            <button onclick="calculateGrade()">
                Calculate Grade
            </button>

            <div id="gradeResult" class="result"></div>

        </section>


        <!-- 3. Odd Numbers -->
        <section class="card">

            <h2>3. Odd Numbers from 1 to N</h2>

            <label for="nOdd">Enter N:</label>

            <input
                type="number"
                id="nOdd"
                min="1"
                placeholder="Enter N"
            >

            <button onclick="displayOddNumbers()">
                Display Odd Numbers
            </button>

            <div id="oddResult" class="result"></div>

        </section>


        <section class="card">

            <h2>4. Sort N Numbers</h2>

            <label for="numbers">
                Enter numbers separated by commas:
            </label>

            <input
                type="text"
                id="numbers"
                placeholder="50,20,10,40,30"
            >

            <button onclick="sortNumbers()">
                Sort Numbers
            </button>

            <div id="sortResult" class="result"></div>

        </section>

        <section class="card">

            <h2>5. Student Information Form</h2>

            <form
                action="form.php"
                method="POST"
                enctype="multipart/form-data"
            >

                <!-- Textbox -->
                <label for="name">Name:</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >


                <label for="password">Password:</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >


                <!-- Radio / Option button -->
                <label>Gender:</label>

                <div class="radio-group">

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Male"
                            required
                        >
                        Male
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Female"
                        >
                        Female
                    </label>

                </div>



                <label for="animal">Favourite Animal:</label>

                <select id="animal" name="animal">

                    <option value="Dog">Dog</option>
                    <option value="Cat">Cat</option>
                    <option value="Lion">Lion</option>
                    <option value="Tiger">Tiger</option>

                </select>


                <label for="file">Upload File:</label>

                <input
                    type="file"
                    id="file"
                    name="file"
                >


                <input
                    type="hidden"
                    name="hiddenValue"
                    value="PHP Client Server Practical"
                >


                <button type="submit">
                    Submit Form
                </button>

            </form>

        </section>




    <script src="script.js"></script>

</body>

</html>
